name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/Vroom.Client/package-lock.json
      - name: Windows gates
        if: runner.os == 'Windows'
        run: node scripts/check.mjs --install --skip-model --require-media
      - name: Portable gates
        if: runner.os == 'Linux'
        run: node scripts/check.mjs --install --web --skip-runtime
      - name: Select pinned Xcode
        if: runner.os == 'macOS'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
          test -d /Applications/Xcode_27.2.app
      - name: macOS gates including real media
        if: runner.os == 'macOS'
        run: node scripts/check.mjs --install --skip-model --require-media
      - name: Package and audit relocated macOS runtime
        if: runner.os == 'macOS'
        run: npm run publish:macos -- --without-model
      - name: macOS development package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-development-package
          path: |
            artifacts/publish/macos-arm64/Vroom.zip
            artifacts/publish/macos-arm64/SHA256SUMS
            artifacts/publish/macos-arm64/validation.json
            artifacts/publish/macos-x64/Vroom.zip
            artifacts/publish/macos-x64/SHA256SUMS
            artifacts/publish/macos-x64/validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Production dependency audit
        if: runner.os == 'Windows'
        working-directory: src/Vroom.Client
        run: npm audit --omit=dev --audit-level=high
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ runner.os }}
          path: .artifacts/test-results/*.trx
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

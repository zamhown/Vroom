name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/Vroom.Client/package-lock.json
      - name: Windows gates
        if: runner.os == 'Windows'
        run: node scripts/check.mjs --install --skip-model --require-media
      - name: Portable gates
        if: runner.os != 'Windows'
        run: node scripts/check.mjs --install --web --skip-runtime
      - name: Mac Catalyst compile
        if: runner.os == 'macOS'
        run: |
          dotnet workload install maui-maccatalyst
          dotnet build src/Vroom.App -p:VroomTargetFramework=net10.0-maccatalyst -nologo
      - name: Production dependency audit
        if: runner.os == 'Windows'
        working-directory: src/Vroom.Client
        run: npm audit --omit=dev --audit-level=high
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ runner.os }}
          path: .artifacts/test-results/*.trx
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
